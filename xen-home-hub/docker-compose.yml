version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: xen-home-hub_web_1
      APP_PORT: 3000

  web:
    # Image publiée par : docker build -t ghcr.io/xenox/home-hub:VERSION . && docker push ghcr.io/xenox/home-hub:VERSION
    image: ghcr.io/xenox/home-hub:0.1.0@sha256:7d89e0d6d2987dc344aae18bc070e1018224d258b464dae87dc46b54b1c3d25b
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      CONFIG_FILE: /data/config.toml
