version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: xen-home-hub_web_1
      APP_PORT: 3000

  web:
    # Image publiée par : docker build -t ghcr.io/xenox/home-hub:VERSION . && docker push ghcr.io/xenox/home-hub:VERSION
    image: ghcr.io/xenox/home-hub:0.2.0@sha256:bb780d2a4c359145077db7e4d0e48e7288bf52acaeba092fc284c25081176ffc
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      CONFIG_FILE: /data/config.toml
